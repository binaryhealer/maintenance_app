<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Client Portal</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 20px 0; }
        .stat { background: #f9f9f9; padding: 20px; border-radius: 6px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; color: #3b82f6; }
        .stat-label { color: #666; font-size: 14px; margin-top: 10px; }
        .message { padding: 15px; background: #e3f2fd; border: 1px solid #90caf9; border-radius: 4px; margin: 20px 0; }
        .error { background: #ffebee; border-color: #ef5350; color: #c62828; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔧 GMAO Client Portal</h1>
    
    <div id="user-info" class="message" style="background: #f0f9ff; border-color: #7dd3fc;">
        Logged in as: <strong id="username">Loading...</strong>
    </div>

    <h2>Dashboard</h2>
    
    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="stat-equipment">0</div>
            <div class="stat-label">Equipment</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="stat-tickets">0</div>
            <div class="stat-label">Open Tickets</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="stat-warranty">0</div>
            <div class="stat-label">Under Warranty</div>
        </div>
        <div class="stat">
            <div class="stat-number" id="stat-mc">0</div>
            <div class="stat-label">Active MC</div>
        </div>
    </div>

    <div id="status" class="message">Loading portal...</div>
    
    <button onclick="location.reload()">Refresh</button>
</div>

<script>
// Simple portal - just show user info
document.addEventListener('DOMContentLoaded', function() {
    // Show current user
    document.getElementById('username').textContent = frappe.session.user;
    
    // Try to get customer
    frappe.call({
        method: 'frappe.client.get_list',
        args: {
            doctype: 'Contact',
            filters: { 'email_id': frappe.session.user },
            fields: ['customer_name']
        },
        callback: function(r) {
            if (r.message && r.message.length > 0) {
                let customer = r.message[0].customer_name;
                document.getElementById('status').innerHTML = '✓ Portal loaded for customer: <strong>' + customer + '</strong>';
                document.getElementById('status').className = 'message';
            } else {
                document.getElementById('status').innerHTML = '⚠ Contact not found for this user. Please create a Contact record.';
                document.getElementById('status').className = 'message error';
            }
        },
        error: function(err) {
            document.getElementById('status').innerHTML = '❌ Error: ' + err.responseText;
            document.getElementById('status').className = 'message error';
        }
    });
});
</script>
</body>
</html>
