<div id="panel-equipment" class="view-panel">
    <div id="equipment-list-view">
        <div class="cp-section-head">
            <div>
                <div class="cp-eyebrow">Asset Register</div>
                <h3>Your Installed Equipment</h3>
                <p>Open an equipment record to see components, service history, lifecycle, configuration changes and tickets in one place.</p>
            </div>
            <button class="btn-primary" onclick="window.openTicketModal()">+ Raise Service Ticket</button>
        </div>

        <div class="cp-filter-bar">
            <label class="cp-filter-field">
                <span>Branch</span>
                <select id="eq-filter-branch" onchange="window.filterEquipment()">
                    <option value="">All Operating Branches</option>
                </select>
            </label>
            <label class="cp-filter-field">
                <span>Category</span>
                <select id="eq-filter-category" onchange="window.filterEquipment()">
                    <option value="">All Categories</option>
                </select>
            </label>
            <label class="cp-filter-field cp-filter-grow">
                <span>Search</span>
                <input id="eq-filter-search" type="search" placeholder="Equipment, model, serial, asset code…" oninput="window.filterEquipment()">
            </label>
            <label class="cp-filter-field">
                <span>Maintenance from</span>
                <input type="date" id="eq-filter-start-date" onchange="window.filterEquipment()">
            </label>
            <label class="cp-filter-field">
                <span>Maintenance to</span>
                <input type="date" id="eq-filter-end-date" onchange="window.filterEquipment()">
            </label>
            <button type="button" class="cp-secondary-btn" onclick="window.clearEquipmentDateFilters()">Clear dates</button>
        </div>

        <div class="table-container cp-equipment-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Equipment</th>
                        <th>Branch</th>
                        <th>Category</th>
                        <th>Model</th>
                        <th>Status</th>
                        <th>Health</th>
                        <th>Next Maintenance</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="table-equipment-body"></tbody>
            </table>
        </div>
    </div>

    <div id="equipment-detail-view" class="cp-workspace" style="display:none;">
        <div class="cp-workspace-loading">Loading equipment record…</div>
    </div>
</div>
