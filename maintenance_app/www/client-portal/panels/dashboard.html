<div id="panel-dashboard" class="view-panel active">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:16px;">
        <div>
            <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#3b82f6;">Client Service Overview</div>
            <h2 style="margin:4px 0 5px;font-size:24px;color:#0f172a;">Dashboard</h2>
            <p style="margin:0;color:#64748b;font-size:13px;">Live service and equipment status for your account.</p>
        </div>

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <button
                type="button"
                class="btn-primary"
                onclick="window.openTicketModal()"
                style="padding:10px 16px;border-radius:8px;font-weight:700;white-space:nowrap;"
            >
                + Create Service Ticket
            </button>
        </div>
    </div>

    <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:16px;">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;">
            <label style="display:flex;flex-direction:column;gap:5px;">
                <span style="font-size:10px;font-weight:800;color:#64748b;">ACTIVITY PERIOD</span>
                <select id="cp-dashboard-period" onchange="window.cpLoadDashboardKpis()" style="height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;">
                    <option value="10">Last 10 days</option>
                    <option value="20">Last 20 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="all">All Time</option>
                </select>
            </label>

            <label style="display:flex;flex-direction:column;gap:5px;">
                <span style="font-size:10px;font-weight:800;color:#64748b;">STATUS</span>
                <select id="cp-dashboard-status" onchange="window.cpLoadDashboardKpis()" style="height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;">
                    <option value="">All statuses</option>
                </select>
            </label>

            <label style="display:flex;flex-direction:column;gap:5px;">
                <span style="font-size:10px;font-weight:800;color:#64748b;">TICKET TYPE</span>
                <select id="cp-dashboard-type" onchange="window.cpLoadDashboardKpis()" style="height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;">
                    <option value="">All types</option>
                </select>
            </label>

            <label style="display:flex;flex-direction:column;gap:5px;">
                <span style="font-size:10px;font-weight:800;color:#64748b;">PRIORITY</span>
                <select id="cp-dashboard-priority" onchange="window.cpLoadDashboardKpis()" style="height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;">
                    <option value="">All priorities</option>
                </select>
            </label>


            <label style="display:flex;flex-direction:column;gap:5px;">
                <span style="font-size:10px;font-weight:800;color:#64748b;">CLIENT TYPE</span>
                <select id="cp-dashboard-client-type" onchange="window.cpLoadDashboardKpis()" style="height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;">
                    <option value="">All client types</option>
                </select>
            </label>

            <label id="cp-dashboard-branch-wrap" style="display:flex;flex-direction:column;gap:5px;">
                <span style="font-size:10px;font-weight:800;color:#64748b;">BRANCH</span>
                <select id="cp-dashboard-branch" onchange="window.cpLoadDashboardKpis()" style="height:38px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:0 10px;">
                    <option value="">All branches</option>
                </select>
            </label>
        </div>
    </div>

    <div id="cp-dashboard-kpi-error" style="display:none;margin-bottom:12px;padding:10px 12px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:8px;font-size:12px;"></div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;">
        <button type="button" onclick="window.location.href='/client-portal?ticket_filter=active'" class="stat-card" style="text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;cursor:pointer;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">ACTIVE TICKETS</div>
            <div id="cp-kpi-open-tickets" style="font-size:30px;font-weight:800;color:#0f172a;margin:12px 0 6px;">—</div>
            <div style="font-size:10px;color:#94a3b8;">Open, planned, in progress or on hold</div>
        </button>

        <button type="button" onclick="window.location.href='/client-portal?ticket_filter=overdue'" class="stat-card" style="text-align:left;background:#fff;border:1px solid #fecaca;border-radius:10px;padding:16px;cursor:pointer;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">OVERDUE TICKETS</div>
            <div id="cp-kpi-overdue-tickets" style="font-size:30px;font-weight:800;color:#b91c1c;margin:12px 0 6px;">—</div>
            <div style="font-size:10px;color:#94a3b8;">Past resolution due date</div>
        </button>

        <button type="button" onclick="window.location.href='/client-portal?ticket_filter=awaiting_client'" class="stat-card" style="text-align:left;background:#fff;border:1px solid #fde68a;border-radius:10px;padding:16px;cursor:pointer;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">AWAITING CLIENT</div>
            <div id="cp-kpi-awaiting-client" style="font-size:30px;font-weight:800;color:#92400e;margin:12px 0 6px;">—</div>
            <div style="font-size:10px;color:#94a3b8;">Waiting for customer action</div>
        </button>

        <button type="button" onclick="window.location.href='/client-portal/service-logs'" class="stat-card" style="text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;cursor:pointer;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">INTERVENTIONS / SERVICE LOGS</div>
            <div id="cp-kpi-interventions" style="font-size:30px;font-weight:800;color:#0f172a;margin:12px 0 6px;">—</div>
            <div id="cp-kpi-period-label" style="font-size:10px;color:#94a3b8;">Selected period</div>
        </button>

        <button type="button" onclick="window.location.href='/client-portal/planned-interventions?status=Scheduled'" class="stat-card" style="text-align:left;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;cursor:pointer;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">PLANNED JOBS</div>
            <div id="cp-kpi-planned-jobs" style="font-size:30px;font-weight:800;color:#0f172a;margin:12px 0 6px;">—</div>
            <div style="font-size:10px;color:#94a3b8;">Upcoming missions with status Scheduled</div>
        </button>

        <button type="button" onclick="window.location.href='/client-portal?equipment_view=needs_attention'" class="stat-card" style="text-align:left;background:#fff;border:1px solid #fed7aa;border-radius:10px;padding:16px;cursor:pointer;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">EQUIPMENT ATTENTION</div>
            <div id="cp-kpi-equipment-attention" style="font-size:30px;font-weight:800;color:#9a3412;margin:12px 0 6px;">—</div>
            <div style="font-size:10px;color:#94a3b8;">Equipment health is not Good</div>
        </button>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px;">
        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;min-width:0;">
            <div style="font-size:12px;font-weight:800;color:#334155;margin-bottom:14px;">Tickets by Status</div>
            <div id="cp-chart-ticket-status"></div>
        </div>

        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;min-width:0;">
            <div style="font-size:12px;font-weight:800;color:#334155;margin-bottom:14px;">Tickets by Priority</div>
            <div id="cp-chart-ticket-priority"></div>
        </div>

        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;min-width:0;">
            <div style="font-size:12px;font-weight:800;color:#334155;margin-bottom:14px;">Tickets by Type</div>
            <div id="cp-chart-ticket-type"></div>
        </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">TICKETS IN PERIOD</div>
            <div id="cp-kpi-tickets-period" style="font-size:24px;font-weight:800;color:#0f172a;margin-top:10px;">—</div>
        </div>

        <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;">
            <div style="font-size:11px;font-weight:800;color:#64748b;">TOTAL EQUIPMENT</div>
            <div id="cp-kpi-equipment-total" style="font-size:24px;font-weight:800;color:#0f172a;margin-top:10px;">—</div>
        </div>
    </div>
</div>
