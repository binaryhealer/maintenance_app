<script>
    // 1. Core Global State Store Registry Definition
    window.PortalApp = {
        customerName: "{{ customer_company }}", 
        userEmail: "{{ user }}",
        // Safely stringifies and hydates the frontend application state cache
        cachedEquipment: {% if preloaded_equipment %}{{ preloaded_equipment | json }}{% else %}[]{% endif %},
        cachedTickets: [],
        deepTargetAssetFilter: null,
        deepTargetCompFilter: null
    };

    frappe.ready(function() {
        window.addEventListener('click', function() {
            const drop = document.getElementById('user-dropdown');
            if(drop) drop.style.display = 'none';
        });

        if (window.PortalApp.customerName && window.PortalApp.customerName !== "None" && window.PortalApp.customerName !== "") {
            window.loadPortalData();
        } else {
            window.showGlobalError('⚠ Profile Error: No verified Customer account link found for this user account.');
        }
    });

    window.toggleUserDropdown = function(event) {
        event.stopPropagation();
        const drop = document.getElementById('user-dropdown');
        if(drop) drop.style.display = drop.style.display === 'none' ? 'block' : 'none';
    };

    window.cpGo = function(panelId) {
        document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));

        const targetPanel = document.getElementById('panel-' + panelId);
        if(targetPanel) targetPanel.classList.add('active');

        const targetMenu = document.getElementById('menu-' + panelId);
        if(targetMenu) targetMenu.classList.add('active');
    };

    window.showGlobalError = function(msg) {
        const el = document.getElementById('portal-status-alert');
        if(el) {
            el.textContent = msg;
            el.className = 'status-msg alert-error';
            el.style.display = 'block';
        }
    };

    window.openTicketModal = function(equipmentName, componentName) {
        const modal = document.getElementById('ticket-modal');
        const eqSelect = document.getElementById('modal-equipment-select');
        const compSelect = document.getElementById('modal-component-select');
        if(!modal || !eqSelect || !compSelect) return;

        eqSelect.innerHTML = '<option value="">-- Choose Equipment --</option>';
        (window.PortalApp.cachedEquipment || []).forEach(eq => {
            const label = eq.custom_asset_name || eq.custom_display_name || eq.name;
            eqSelect.innerHTML += `<option value="${window.cpEsc(eq.name)}">${window.cpEsc(label)}${eq.custom_branch ? ' · '+window.cpEsc(eq.custom_branch) : ''}</option>`;
        });

        modal.style.display = 'flex';
        if(equipmentName) eqSelect.value = equipmentName;
        window.refreshTicketModalContext(componentName || '');
    };

    window.refreshTicketModalContext = function(preselectComponent) {
        const eqSelect = document.getElementById('modal-equipment-select');
        const compSelect = document.getElementById('modal-component-select');
        const customerEl = document.getElementById('modal-customer-display');
        const branchEl = document.getElementById('modal-branch-display');
        if(!eqSelect || !compSelect) return;

        const equipmentName = eqSelect.value;
        compSelect.innerHTML = '<option value="">-- Equipment only / No component --</option>';
        if(customerEl) customerEl.textContent = window.PortalApp.customerName || '—';
        if(branchEl) branchEl.textContent = '—';
        if(!equipmentName) return;

        const basic = (window.PortalApp.cachedEquipment || []).find(x => x.name === equipmentName);
        if(basic && branchEl) branchEl.textContent = basic.custom_branch || '—';

        const useData = function(data) {
            const eq = data.equipment || {};
            if(customerEl) customerEl.textContent = data.customer_display || window.PortalApp.customerName || '—';
            if(branchEl) branchEl.textContent = data.branch_display || eq.custom_branch || '—';
            const comps = (data.logs && data.logs.components) || [];
            comps.forEach(c => {
                const id = c.custom_equipment_component || c.equipment_component || c.component_id || c.custom_component_id || c.custom_component || c.name || '';
                const title = c.custom_display_name || c.custom_equipment_type || c.custom_component_item || id;
                if(id) compSelect.innerHTML += `<option value="${window.cpEsc(id)}">${window.cpEsc(title)} · ${window.cpEsc(id)}</option>`;
            });
            if(preselectComponent) compSelect.value = preselectComponent;
        };

        window.PortalApp.equipmentWorkspaceCache = window.PortalApp.equipmentWorkspaceCache || {};
        const cached = window.PortalApp.equipmentWorkspaceCache[equipmentName];
        if(cached) return useData(cached);

        frappe.call({
            method:'maintenance_app.api.client_portal_get_equipment_workspace',
            args:{equipment_name:equipmentName},
            callback:function(r){
                if(r.message){
                    window.PortalApp.equipmentWorkspaceCache[equipmentName]=r.message;
                    useData(r.message);
                }
            }
        });
    };

    window.closeTicketModal = function() {
        const modal = document.getElementById('ticket-modal');
        if(modal) modal.style.display = 'none';
        const form = document.getElementById('create-ticket-form');
        if(form) form.reset();
    };

    window.submitServiceTicket = function(event) {
        event.preventDefault();
        const equipmentName = document.getElementById('modal-equipment-select').value;
        if(!equipmentName) {
            frappe.show_alert({message:'Please choose equipment.', indicator:'orange'});
            return;
        }
        frappe.call({
            method: 'maintenance_app.api.client_portal_create_service_ticket',
            args: {
                equipment_name: equipmentName,
                component_name: document.getElementById('modal-component-select').value || null,
                request_type: document.getElementById('modal-request-type').value || null,
                subject: document.getElementById('modal-subject').value,
                description: document.getElementById('modal-description').value
            },
            freeze: true,
            callback: function(r) {
                if(r.message && r.message.ticket) {
                    const ticketName = r.message.ticket;
                    frappe.show_alert({ message: `✔ Ticket ${ticketName} raised`, indicator: 'green' });
                    window.closeTicketModal();
                    window.PortalApp.equipmentWorkspaceCache = {};
                    window.loadPortalData();
                    setTimeout(function(){
                        window.location.href='/client-portal/ticket?name='+encodeURIComponent(ticketName);
                    }, 500);
                }
            }
        });
    };

    window.toggleAssetDrawer = function(assetId, event) {
        if(event.target.tagName === 'SELECT' || event.target.tagName === 'INPUT' || event.target.tagName === 'BUTTON' || event.target.tagName === 'A') return;
        
        const drawer = document.getElementById(`drawer-${assetId}`);
        const indicator = document.getElementById(`ind-${assetId}`);
        if(!drawer) return;

        if(drawer.style.display === 'none') {
            drawer.style.display = 'table-row';
            if(indicator) indicator.textContent = '▾';
            window.switchWorkspaceTab(assetId, 'logs'); 
        } else {
            drawer.style.display = 'none';
            if(indicator) indicator.textContent = '▸';
        }
    };

    window.filterTicketsByComponent = function(componentName) {
        document.getElementById('tk-filter-branch').value = "";
        document.getElementById('tk-filter-status').value = ""; 
        
        const filtered = window.PortalApp.cachedTickets.filter(t => {
            return (t.custom_subject && t.custom_subject.includes(componentName)) || 
                   (t.name && t.name === componentName);
        });
        
        window.renderTicketsTable(filtered);
        window.cpGo('tickets');
    };

    window.routeToTicketLedger = function(assetId, componentName) {
        window.PortalApp.deepTargetAssetFilter = assetId;
        window.PortalApp.deepTargetCompFilter = componentName || null;

        document.getElementById('tk-filter-branch').value = "";
        document.getElementById('tk-filter-status').value = ""; 

        const resetBtn = document.getElementById('btn-clear-tk-search');
        if(resetBtn) resetBtn.style.display = 'inline-block';

        window.filterTickets();
        window.cpGo('tickets');
    };

    window.resetTicketFilters = function() {
        window.PortalApp.deepTargetAssetFilter = null;
        window.PortalApp.deepTargetCompFilter = null;
        
        document.getElementById('tk-filter-status').value = "Open"; 
        const resetBtn = document.getElementById('btn-clear-tk-search');
        if(resetBtn) resetBtn.style.display = 'none';

        window.filterTickets();
    };

    window.shortcutViewTickets = function(assetId, event) {
        if(event) event.stopPropagation();
        window.routeToTicketLedger(assetId);
    };

    window.shortcutViewServiceLogs = function(assetId, assetName, event) {
        if(event) event.stopPropagation();
        const logs = window.PortalApp.cachedTickets.filter(t => t.custom_target_equipment === assetId);
        
        let logRows = '';
        if(logs.length === 0) {
            logRows = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:20px;">No operational intervention summaries recorded.</td></tr>`;
        } else {
            logs.forEach(t => {
                let statusColor = ['Closed', 'Resolved'].includes(t.custom_ticket_status) ? '#10b981' : '#f59e0b';
                logRows += `
                    <tr>
                        <td style="color:#64748b; padding:12px;">${t.custom_opening_date || t.creation.split(' ')[0]}</td>
                        <td style="padding:12px;"><span style="background:#f1f5f9; color:#475569; padding:2px 6px; border-radius:4px; font-weight:600; font-size:12px;">Intervention</span></td>
                        <td style="font-family:monospace; font-size:13px; color:#e2e8f0; padding:12px;">${window.PortalApp.userEmail}</td>
                        <td style="font-weight:700; color:${statusColor}; padding:12px;">${t.custom_ticket_status}</td>
                        <td style="color:#e2e8f0; font-size:13px; padding:12px;">${t.custom_subject || '-'}</td>
                        <td style="padding:12px;"><a href="#" onclick="window.routeToTicketLedger('${assetId}'); document.getElementById('log-modal').remove(); return false;" style="color:#3b82f6; font-weight:600; text-decoration:none;">${t.name}</a></td>
                    </tr>
                `;
            });
        }

        const modalHtml = `
            <div id="log-modal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.4); z-index:99999; display:flex; justify-content:center; align-items:center;">
                <div style="background:#0f172a; color:#f8fafc; padding:24px; border-radius:12px; width:90%; max-width:960px; box-shadow:0 20px 25px -5px rgba(0,0,0,0.3); border:1px solid #334155;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; border-bottom:1px solid #1e293b; padding-bottom:12px;">
                        <div>
                            <h3 style="color:white; font-size:16px;">Service Operational Logs Matrix</h3>
                            <small style="color:#94a3b8;">Asset Profile: ${assetName} (${assetId})</small>
                        </div>
                        <button onclick="document.getElementById('log-modal').remove()" style="background:transparent; border:none; color:#94a3b8; font-size:20px; cursor:pointer;">&times;</button>
                    </div>
                    <div style="overflow-x:auto; max-height:400px; border-radius:6px; background:#1e293b;">
                        <table style="width:100%; text-align:left; font-size:13px; border-collapse:collapse;">
                            <thead>
                                <tr style="background:#111827; color:#94a3b8; text-transform:uppercase; font-size:11px; letter-spacing:0.5px;">
                                    <th style="padding:12px;">Date</th><th style="padding:12px;">Type</th><th style="padding:12px;">Technician</th><th style="padding:12px;">Outcome</th><th style="padding:12px;">Notes Summary</th><th style="padding:12px;">Ticket ID</th>
                                </tr>
                            </thead>
                            <tbody>${logRows}</tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };

    window.switchWorkspaceTab = function(assetId, tabId) {
        const asset = window.PortalApp.cachedEquipment.find(eq => eq.name === assetId);
        if(!asset) return;

        document.querySelectorAll(`#drawer-${assetId} .workspace-tab-btn`).forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`tab-btn-${tabId}-${assetId}`);
        if(activeBtn) activeBtn.classList.add('active');

        const displayArea = document.getElementById(`workspace-view-${assetId}`);
        if(!displayArea) return;
        displayArea.innerHTML = '';

        if(tabId === 'logs') {
            const relatedTickets = window.PortalApp.cachedTickets.filter(t => t.custom_target_equipment === assetId);
            let logRows = '';
            if(relatedTickets.length === 0) {
                logRows = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:24px; font-style:italic;">No structural interventions profiles found.</td></tr>`;
            } else {
                relatedTickets.forEach(t => {
                    let statusColor = ['Closed', 'Cancelled', 'Resolved'].includes(t.custom_ticket_status) ? '#10b981' : '#f59e0b';
                    logRows += `
                        <tr style="border-bottom:1px solid #f1f5f9;">
                            <td style="padding:10px; color:#475569;">${t.custom_opening_date || t.creation.split(' ')[0]}</td>
                            <td style="padding:10px;"><span style="background:#f1f5f9; color:#475569; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:600;">Service</span></td>
                            <td style="padding:10px; color:#334155; font-family:monospace;">${window.PortalApp.userEmail}</td>
                            <td style="padding:10px; font-weight:700; color:${statusColor};">${t.custom_ticket_status}</td>
                            <td style="padding:10px; color:#334155; font-size:13px;">${t.custom_subject || '-'}</td>
                            <td style="padding:10px;"><a href="#" onclick="window.routeToTicketLedger('${assetId}'); return false;" style="color:#3b82f6; font-weight:700; text-decoration:none;">${t.name} →</a></td>
                        </tr>
                    `;
                });
            }

            displayArea.innerHTML = `
                <div style="overflow-x:auto;">
                    <table style="width:100%; text-align:left; border-collapse:collapse; font-size:13px;">
                        <thead>
                            <tr style="background:#f8fafc; color:#64748b; text-transform:uppercase; font-size:11px; font-weight:700;">
                                <th style="padding:10px; border-bottom:1px solid #e2e8f0;">Date</th>
                                <th style="padding:10px; border-bottom:1px solid #e2e8f0;">Type</th>
                                <th style="padding:10px; border-bottom:1px solid #e2e8f0;">Technician</th>
                                <th style="padding:10px; border-bottom:1px solid #e2e8f0;">Outcome</th>
                                <th style="padding:10px; border-bottom:1px solid #e2e8f0;">Notes Summary</th>
                                <th style="padding:10px; border-bottom:1px solid #e2e8f0;">Ticket Link</th>
                            </tr>
                        </thead>
                        <tbody>${logRows}</tbody>
                    </table>
                </div>
            `;
        }

        if(tabId === 'config') {
            displayArea.innerHTML = `
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; padding:8px 0; font-size:13px; color:#475569;">
                    <div style="background:#f8fafc; padding:12px; border-radius:6px; border:1px solid #e2e8f0;">⚙️ <strong>Asset Base Ref:</strong> <span style="font-family:monospace; color:#1e293b; font-weight:600;">${asset.name}</span></div>
                    <div style="background:#f8fafc; padding:12px; border-radius:6px; border:1px solid #e2e8f0;">📜 <strong>Assigned SLA Contract:</strong> <span style="color:#1e293b; font-weight:600;">${asset.custom_maintenance_contract || 'Standard Coverage'}</span></div>
                    <div style="background:#f8fafc; padding:12px; border-radius:6px; border:1px solid #e2e8f0;">🛡️ <strong>Active Warranty Code:</strong> <span style="color:#1e293b; font-weight:600;">${asset.custom_warranty || 'None / Expired'}</span></div>
                    <div style="background:#f8fafc; padding:12px; border-radius:6px; border:1px solid #e2e8f0;">⏳ <strong>Inspections Status:</strong> <span class="badge badge-success" style="font-size:11px;">Validated In Use</span></div>
                </div>
            `;
        }

        if(tabId === 'components') {
            displayArea.innerHTML = `
                <div>
                    <div style="display: flex; gap: 16px; align-items: center; margin-bottom: 16px; background: #f8fafc; padding: 12px 16px; border-radius: 6px; border: 1px solid #e2e8f0; flex-wrap: wrap;">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase;">1. System Group</label>
                            <select id="group-select-${assetId}" onchange="window.handleDrawerGroupChange('${assetId}')" style="padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; color: #1e293b; background: white; font-weight: 600; outline: none; cursor: pointer; min-width: 180px; height: 34px;"></select>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <label style="font-size: 10px; font-weight: 700; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase;">2. Equipment Component</label>
                            <select id="comp-select-${assetId}" onchange="window.handleDrawerComponentChange('${assetId}')" style="padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; color: #1e293b; background: white; font-weight: 600; outline: none; cursor: pointer; min-width: 220px; height: 34px;">
                                <option value="">All Components</option>
                            </select>
                        </div>
                    </div>
                    <div class="component-grid" id="grid-${assetId}"></div>
                </div>
            `;

            const groupSelect = document.getElementById(`group-select-${assetId}`);
            const compSelect = document.getElementById(`comp-select-${assetId}`);
            const gridEl = document.getElementById(`grid-${assetId}`);

            const components = asset.components || [];
            if(components.length === 0) {
                if(groupSelect) groupSelect.parentElement.parentElement.style.display = 'none';
                if(gridEl) gridEl.innerHTML = '<div style="color:#64748b; font-size:13px; font-style:italic; padding: 5px 0;">No registered component tracking structures assigned to this asset block.</div>';
                return;
            }

            const uniqueGroups = [...new Set(components.map(c => c.custom_component_group || 'General / Auxiliary System'))].sort();
            groupSelect.innerHTML = '';
            uniqueGroups.forEach(g => {
                groupSelect.innerHTML += `<option value="${g}">${g}</option>`;
            });

            gridEl.mapDataset = components;
            gridEl.parentAssetName = assetId;
            window.handleDrawerGroupChange(assetId);
        }
    };

    window.handleDrawerGroupChange = function(assetId) {
        const groupSelect = document.getElementById(`group-select-${assetId}`);
        const compSelect = document.getElementById(`comp-select-${assetId}`);
        const gridEl = document.getElementById(`grid-${assetId}`);
        if(!groupSelect || !compSelect || !gridEl || !gridEl.mapDataset) return;

        const selectedGroup = groupSelect.value;
        const filteredComponents = gridEl.mapDataset.filter(c => (c.custom_component_group || 'General / Auxiliary System') === selectedGroup);

        compSelect.innerHTML = '<option value="">All Components</option>';
        filteredComponents.forEach(c => {
            let labelRaw = c.custom_display_name || c.custom_component || 'Unnamed Part';
            let labelClean = labelRaw.includes(' - ') ? labelRaw.split(' - ').pop() : labelRaw;
            compSelect.innerHTML += `<option value="${labelRaw}">${labelClean}</option>`;
        });

        window.handleDrawerComponentChange(assetId);
    };

    window.handleDrawerComponentChange = function(assetId) {
        const groupSelect = document.getElementById(`group-select-${assetId}`);
        const compSelect = document.getElementById(`comp-select-${assetId}`);
        const gridEl = document.getElementById(`grid-${assetId}`);
        if(!groupSelect || !compSelect || !gridEl || !gridEl.mapDataset) return;

        const currentGroup = groupSelect.value;
        const currentCompName = compSelect.value;

        gridEl.innerHTML = '';

        const results = gridEl.mapDataset.filter(c => {
            const matchesGroup = (c.custom_component_group || 'General / Auxiliary System') === currentGroup;
            const itemLabel = c.custom_display_name || c.custom_component || '';
            const matchesComp = !currentCompName || itemLabel === currentCompName;
            return matchesGroup && matchesComp;
        });

        results.forEach(item => {
            let rawTitle = item.custom_display_name || item.custom_component || 'Unnamed Component';
            let cleanTitle = rawTitle.includes(' - ') ? rawTitle.split(' - ').pop() : rawTitle;
            
            let statusBadgeClass = 'badge-success';
            if(item.custom_status === 'Faulty') statusBadgeClass = 'badge-error';
            if(['Replaced', 'Removed'].includes(item.custom_status)) statusBadgeClass = 'badge-warning';

            const openCompTickets = window.PortalApp.cachedTickets.filter(t => 
                t.custom_target_equipment === assetId && 
                !['Closed', 'Cancelled', 'Resolved'].includes(t.custom_ticket_status) &&
                (t.custom_subject && t.custom_subject.toLowerCase().includes(rawTitle.toLowerCase()))
            ).length;

            const compTicketBadge = openCompTickets > 0 ? 
                `<span class="badge badge-error" style="font-size:10px; padding:2px 6px;">⚠️ ${openCompTickets} Open</span>` : 
                `<span style="font-size:11px; color:#94a3b8;">✔ Clear</span>`;

            let partMake = item.custom_brand || '-';
            let partModel = item.custom_model || '-';
            let partSerial = item.custom_serial_number || 'N/A';

            gridEl.innerHTML += `
                <div class="component-item-card" style="background: #f8fafc; flex-direction: column; align-items: flex-start; gap: 8px;">
                    <div style="display: flex; justify-content: space-between; width: 100%; align-items: flex-start; gap: 12px;">
                        <div><span style="font-size:15px; font-weight:700; color:#1e293b;">${cleanTitle}</span></div>
                        <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
                            <span class="badge ${statusBadgeClass}" style="font-size:11px; padding:2px 8px;">${item.custom_status || 'Installed'}</span>
                            ${compTicketBadge}
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; width: 100%; background: white; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0; font-size: 12px;">
                        <div style="color: #64748b;">Make: <strong style="color:#334155;">${partMake}</strong></div>
                        <div style="color: #64748b;">Model: <strong style="color:#334155;">${partModel}</strong></div>
                        <div style="color: #64748b; grid-column: span 2; border-top: 1px solid #f1f5f9; padding-top: 4px; margin-top: 2px; display:flex; justify-content:space-between; align-items:center;">
                            <span>Serial No: <strong style="color:#334155; font-family: monospace;">${partSerial}</strong></span>
                            <a href="#" onclick="window.routeToTicketLedger('${assetId}', '${cleanTitle}'); return false;" style="color:#3b82f6; font-weight:700; text-decoration:none; font-size:11px;">View Component Tickets →</a>
                        </div>
                    </div>
                </div>
            `;
        });
    };

    window.renderEquipmentTable = function(assetsList) {
        const tbody = document.getElementById('table-equipment-body');
        if(!tbody) return;
        tbody.innerHTML = '';
        if(assetsList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#64748b; padding:30px;">No asset inventory items match these filter configurations.</td></tr>';
            return;
        }

        assetsList.forEach(eq => {
            let healthClass = ['Excellent', 'Good'].includes(eq.custom_equipment_health) ? 'badge-success' : 'badge-warning';
            let targetDueDate = eq.custom_next_maintenance_date || 'Unscheduled';
            
            const parentTicketCount = window.PortalApp.cachedTickets.filter(t => t.custom_target_equipment === eq.name && !['Closed', 'Cancelled', 'Resolved'].includes(t.custom_ticket_status)).length;
            const parentTicketBadge = parentTicketCount > 0 ? `<span class="badge badge-error" style="margin-left:6px; padding:2px 6px; font-size:10px;">${parentTicketCount} Active</span>` : '';

            tbody.innerHTML += `
                <tr class="asset-row" onclick="window.toggleAssetDrawer('${eq.name}', event)">
                    <td id="ind-${eq.name}" style="color:#64748b; font-weight:bold; text-align:center;">▸</td>
                    <td><strong>${eq.custom_asset_name}</strong>${parentTicketBadge}</td>
                    <td><strong>${eq.custom_branch || '-'}</strong></td>
                    <td>${eq.custom_asset_category || '-'}</td>
                    <td>${eq.custom_model || '-'}</td>
                    <td><span class="badge badge-info">${eq.custom_asset_status || 'Operational'}</span></td>
                    <td><span class="badge ${healthClass}">${eq.custom_equipment_health || 'Unknown'}</span></td>

    window.filterEquipment = function() {
        const selectedBranch = document.getElementById('eq-filter-branch').value;
        const selectedCategory = document.getElementById('eq-filter-category').value;
        const startVal = document.getElementById('eq-filter-start-date').value;
        const endVal = document.getElementById('eq-filter-end-date').value;

        const startDate = startVal ? new Date(startVal).setHours(0,0,0,0) : null;
        const endDate = endVal ? new Date(endVal).setHours(23,59,59,999) : null;

        const filteredData = window.PortalApp.cachedEquipment.filter(eq => {
            const matchesBranch = !selectedBranch || eq.custom_branch === selectedBranch;
            const matchesCategory = !selectedCategory || eq.custom_asset_category === selectedCategory;
            
            let matchesDateRange = true;
            const nextMaintStr = eq.custom_next_maintenance_date;
            
            if (startDate || endDate) {
                if (!nextMaintStr) {
                    matchesDateRange = false; 
                } else {
                    const maintTime = new Date(nextMaintStr).getTime();
                    if (startDate && maintTime < startDate) matchesDateRange = false;
                    if (endDate && maintTime > endDate) matchesDateRange = false;
                }
            }
            return matchesBranch && matchesCategory && matchesDateRange;
        });
        window.renderEquipmentTable(filteredData);
    };

    window.filterTickets = function() {
        const selectedBranch = document.getElementById('tk-filter-branch').value;
        const selectedStatusGroup = document.getElementById('tk-filter-status').value;

        const filteredData = window.PortalApp.cachedTickets.filter(t => {
            if (window.PortalApp.deepTargetAssetFilter) {
                if (t.custom_target_equipment !== window.PortalApp.deepTargetAssetFilter) return false;
                if (window.PortalApp.deepTargetCompFilter) {
                    const subjectMatch = t.custom_subject && t.custom_subject.toLowerCase().includes(window.PortalApp.deepTargetCompFilter.toLowerCase());
                    if (!subjectMatch) return false;
                }
                return true; 
            }

            const matchesBranch = !selectedBranch || t.custom_client_branch === selectedBranch;
            let matchesStatus = true;
            const isClosed = ['Closed', 'Cancelled', 'Resolved'].includes(t.custom_ticket_status);
            if(selectedStatusGroup === 'Open') {
                matchesStatus = !isClosed;
            } else if(selectedStatusGroup === 'Closed') {
                matchesStatus = isClosed;
            }
            return matchesBranch && matchesStatus;
        });
        window.renderTicketsTable(filteredData);
    };

    


    window.updatePreventiveMaintenanceDashboard = function(equipmentList) {
        const equipment = Array.isArray(equipmentList) ? equipmentList : [];
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const dated = equipment
            .filter(eq => eq.custom_next_maintenance_date)
            .map(eq => {
                const raw = String(eq.custom_next_maintenance_date).slice(0, 10);
                const parts = raw.split('-').map(Number);
                const date = parts.length === 3
                    ? new Date(parts[0], parts[1] - 1, parts[2])
                    : new Date(eq.custom_next_maintenance_date);
                return { eq, date };
            })
            .filter(row => !isNaN(row.date.getTime()));

        const upcoming = dated
            .filter(row => row.date >= today)
            .sort((a, b) => a.date - b.date);

        const missed = dated
            .filter(row => row.date < today)
            .sort((a, b) => a.date - b.date);

        const nextCountEl = document.getElementById('stat-next-pm-count');
        const nextDateEl = document.getElementById('stat-next-pm-date');
        const missedCountEl = document.getElementById('stat-missed-pm-count');
        const missedOldestEl = document.getElementById('stat-missed-pm-oldest');

        if(nextCountEl) nextCountEl.textContent = upcoming.length;
        if(nextDateEl) {
            nextDateEl.textContent = upcoming.length
                ? 'Next due: ' + upcoming[0].date.toLocaleDateString()
                : 'No upcoming date';
        }

        if(missedCountEl) missedCountEl.textContent = missed.length;
        if(missedOldestEl) {
            if(missed.length) {
                const days = Math.floor((today - missed[0].date) / 86400000);
                missedOldestEl.textContent = 'Oldest overdue: ' + days + ' day' + (days === 1 ? '' : 's');
            } else {
                missedOldestEl.textContent = 'No missed PM';
            }
        }
    };

window.loadPortalData = function() {

        // 3. Equipment API

                    uniqueCats.sort().forEach(c => {
                        catFilterSelect.innerHTML += `<option value="${c}">${c}</option>`;

            method: 'maintenance_app.api.client_portal_get_contracts',

    window.filterEquipment = function() {
        const branchEl = document.getElementById('eq-filter-branch');
        const catEl = document.getElementById('eq-filter-category');
        const startEl = document.getElementById('eq-filter-start-date');
        const endEl = document.getElementById('eq-filter-end-date');
        const searchEl = document.getElementById('eq-filter-search');
        const selectedBranch = branchEl ? branchEl.value : '';
        const selectedCategory = catEl ? catEl.value : '';
        const startVal = startEl ? startEl.value : '';
        const endVal = endEl ? endEl.value : '';
        const q = (searchEl ? searchEl.value : '').toLowerCase().trim();
        const startDate = startVal ? new Date(startVal).setHours(0,0,0,0) : null;
        const endDate = endVal ? new Date(endVal).setHours(23,59,59,999) : null;

        const filtered = window.PortalApp.cachedEquipment.filter(function(eq) {
            if(selectedBranch && eq.custom_branch !== selectedBranch) return false;
            if(selectedCategory && eq.custom_asset_category !== selectedCategory) return false;
            if(q) {
                const haystack = [eq.name,eq.custom_asset_name,eq.custom_display_name,eq.custom_model,eq.custom_asset_category,eq.custom_branch,eq.custom_asset_id,eq.custom_client_asset_code]
                    .filter(Boolean).join(' ').toLowerCase();
                if(!haystack.includes(q)) return false;
            }
            if(startDate || endDate) {
                if(!eq.custom_next_maintenance_date) return false;
                const t = new Date(eq.custom_next_maintenance_date).getTime();
                if(startDate && t < startDate) return false;
                if(endDate && t > endDate) return false;
            }
            return true;
        });
        window.renderEquipmentTable(filtered);
    };

        let html=`<button class="cp-ws-back" onclick="window.closeEquipmentWorkspace()">← Back to Equipment</button>
            <section class="cp-ws-hero"><div><div class="cp-eyebrow">Installed Equipment</div><div class="cp-ws-title-row"><div class="cp-ws-title">${window.cpEsc(title)}</div><span class="badge badge-info">${window.cpEsc(eq.custom_asset_status || '—')}</span></div>
            <div class="cp-ws-context">${window.cpEsc([data.customer_display, data.branch_display || eq.custom_branch, eq.custom_asset_category].filter(Boolean).join(' · '))}</div><div class="cp-ws-meta">${meta.map(x=>`<span>${window.cpEsc(x)}</span>`).join('')}</div></div>
            <div class="cp-ws-actions"><button class="btn-primary" onclick="window.cpOpenTicketForEquipment('${window.cpEsc(eq.name)}')">+ Raise Ticket</button></div></section>`;
        html+='<div class="cp-tabs">'+tabs.map(function(t){return `<button class="cp-tab-btn ${window.PortalApp.equipmentWorkspaceTab===t[0]?'active':''}" onclick="window.setEquipmentWorkspaceTab('${t[0]}')">${t[1]}${t[2]!==null?` <span class="cp-tab-count">${t[2]}</span>`:''}</button>`;}).join('')+'</div>';
        html+=`<section class="cp-tab-panel">${window.buildEquipmentWorkspaceTab(data)}</section>`;
        root.innerHTML=html;
    };

    window.buildEquipmentWorkspaceTab = function(data) {
        const eq=data.equipment||{}, logs=data.logs||{}, tab=window.PortalApp.equipmentWorkspaceTab;
        if(tab==='overview') return `<div class="cp-panel-title">Equipment Overview</div><div class="cp-info-grid">
            ${window.cpInfoCard('Equipment ID',window.cpEsc(eq.name))}${window.cpInfoCard('Status',window.cpEsc(eq.custom_asset_status||'—'))}${window.cpInfoCard('Operational Status',window.cpEsc(eq.custom_operational_status||'—'))}
            ${window.cpInfoCard('Health',window.cpEsc(eq.custom_equipment_health||'—'))}${window.cpInfoCard('Make',window.cpEsc(eq.custom_make||'—'))}${window.cpInfoCard('Model',window.cpEsc(eq.custom_model||'—'))}
            ${window.cpInfoCard('Serial Number',window.cpEsc(eq.custom_asset_id||'—'))}${window.cpInfoCard('Client Asset Code',window.cpEsc(eq.custom_client_asset_code||'—'))}${window.cpInfoCard('Ownership',window.cpEsc(eq.custom_ownership||'—'))}
            ${window.cpInfoCard('Installed Date',window.cpFmtDate(eq.custom_installed_date))}${window.cpInfoCard('Commissioned Date',window.cpFmtDate(eq.custom_commissioned_date))}${window.cpInfoCard('Last Service',window.cpFmtDate(eq.custom_last_service_date))}
            ${window.cpInfoCard('Next Maintenance',window.cpFmtDate(eq.custom_next_maintenance_date))}${window.cpInfoCard('Maintenance Frequency',window.cpEsc(eq.custom_maint_frequency||'—'))}${window.cpInfoCard('Coverage',window.cpEsc(eq.custom_coverage_type||'—'))}
        </div>`;
        if(tab==='components') return window.buildEquipmentComponents(data);
        if(tab==='service') return window.buildEquipmentLogTable(logs.service||[],'service');
        if(tab==='lifecycle') return window.buildEquipmentLogTable(logs.lifecycle||[],'lifecycle');
        if(tab==='config') return window.buildEquipmentLogTable(logs.config||[],'config');
        if(tab==='tickets') return window.buildEquipmentTickets(data.tickets||[]);
        return '';
    };

    window.setComponentGroupFilter = function(value) {
        window.PortalApp.componentGroupFilter = value || '';
        const data=window.PortalApp.equipmentWorkspaceCache[window.PortalApp.currentEquipmentWorkspace];
        if(data) window.renderEquipmentWorkspace(data);
    };

    window.buildEquipmentComponents = function(data) {
        const comps=(data.logs&&data.logs.components)||[];
        if(!comps.length) return window.cpEmpty('No components are currently registered on this equipment.');

        const groups=[...new Set(comps.map(c => c.custom_component_group||c.custom_item_group||'Unclassified'))]
            .filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b)));
        const selected=window.PortalApp.componentGroupFilter||'';
        const filtered=selected ? comps.filter(c => (c.custom_component_group||c.custom_item_group||'Unclassified')===selected) : comps;

        const filterHtml=`<div class="cp-filter-bar cp-component-filter-bar">
            <label class="cp-filter-field"><span>Component Group</span>
                <select id="component-group-filter" onchange="window.setComponentGroupFilter(this.value)">
                    <option value="">All Component Groups (${comps.length})</option>
                    ${groups.map(g=>{
                        const count=comps.filter(c => (c.custom_component_group||c.custom_item_group||'Unclassified')===g).length;
                        return `<option value="${window.cpEsc(g)}" ${selected===g?'selected':''}>${window.cpEsc(g)} (${count})</option>`;
                    }).join('')}
                </select>
            </label>
            <div class="cp-component-filter-summary">Showing <strong>${filtered.length}</strong> of ${comps.length} components</div>
        </div>`;

        const rows=filtered.map(c=>{
            const id=c.custom_equipment_component||c.equipment_component||c.component_id||c.custom_component_id||c.custom_component||c.name||'';
            const title=c.custom_display_name||c.custom_equipment_type||c.custom_component_item||id||'Component';
            return `<tr>
                <td><a class="cp-component-main-link" href="#" onclick="window.openComponentWorkspace('${window.cpEsc(id)}');return false;">${window.cpEsc(title)}</a><div class="cp-component-code">${window.cpEsc(id)}</div></td>
                <td>${window.cpEsc(c.custom_component_group||c.custom_item_group||'—')}</td>
                <td>${window.cpEsc(c.custom_serial_number||'—')}</td>
                <td>${window.cpEsc(c.custom_brand||c.custom_make||'—')}</td>
                <td>${window.cpEsc(c.custom_model||'—')}</td>
                <td><span class="badge badge-success">${window.cpEsc(c.custom_status||'Installed')}</span></td>
                <td class="cp-table-action"><button class="cp-small-action" onclick="window.cpOpenTicketForEquipment('${window.cpEsc(data.equipment.name)}','${window.cpEsc(id)}')">Ticket</button></td>
            </tr>`;
        }).join('');

        const table=filtered.length ? `<div class="cp-log-table cp-component-table"><table><thead><tr>
            <th>Component</th><th>Group</th><th>Serial</th><th>Brand</th><th>Model</th><th>Status</th><th></th>
        </tr></thead><tbody>${rows}</tbody></table></div>` : window.cpEmpty('No components match this component group.');

        return `<div class="cp-panel-title">Installed Components</div>${filterHtml}${table}`;
    };

    window.buildEquipmentLogTable = function(rows,type) {
        if(!rows.length) return window.cpEmpty(`No ${type === 'config' ? 'configuration changes' : type + ' history'} found.`);
        let head='', body='';
        if(type==='service') {
            head='<th>Date</th><th>Type</th><th>Technician</th><th>Outcome</th><th>Notes</th><th>Ticket</th><th>Report</th>';
            body=rows.map(x=>`<tr><td>${window.cpFmtDateTime(x.custom_end_time||x.creation)}</td><td>${window.cpEsc(x.custom_intervention_type||'Service')}</td><td>${window.cpEsc(x.custom_technician||'—')}</td><td>${window.cpEsc(x.custom_work_outcome||'—')}</td><td>${window.cpEsc(x.custom_notes||'—')}</td><td>${window.cpPortalDocLink('ticket',x.custom_service_ticket)}</td><td>${window.cpPortalDocLink('mi',x.custom_intervention_ref)}</td></tr>`).join('');
        } else if(type==='lifecycle') {
            head='<th>Date</th><th>Event</th><th>Technician</th><th>Action / Notes</th><th>Ticket</th>';
            body=rows.map(x=>`<tr><td>${window.cpFmtDate(x.custom_date||x.creation)}</td><td>${window.cpEsc(x.custom_event||'Lifecycle')}</td><td>${window.cpEsc(x.custom_technician||'—')}</td><td>${window.cpEsc(x.custom_action_taken||'—')}</td><td>${window.cpPortalDocLink('ticket',x.custom_service_ticket)}</td></tr>`).join('');
        } else {
            head='<th>Date</th><th>Parameter</th><th>Previous</th><th>New</th><th>Technician</th><th>Ticket</th>';
            body=rows.map(x=>`<tr><td>${window.cpFmtDateTime(x.custom_config_datetime||x.creation)}</td><td>${window.cpEsc(x.custom_parameter||'—')}</td><td>${window.cpEsc(x.custom_current_value||'—')}</td><td>${window.cpEsc(x.custom_new_value||'—')}</td><td>${window.cpEsc(x.custom_technician||'—')}</td><td>${window.cpPortalDocLink('ticket',x.custom_service_ticket)}</td></tr>`).join('');
        }
        return `<div class="cp-log-table"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    };

    window.PortalApp.equipmentTicketFilters = window.PortalApp.equipmentTicketFilters || {from:'',to:'',type:'',status:''};

    window.updateEquipmentTicketFilter = function(field, value) {
        window.PortalApp.equipmentTicketFilters[field]=value||'';
        const data=window.PortalApp.equipmentWorkspaceCache[window.PortalApp.currentEquipmentWorkspace];
        if(data) window.renderEquipmentWorkspace(data);
    };

    window.clearEquipmentTicketFilters = function() {
        window.PortalApp.equipmentTicketFilters={from:'',to:'',type:'',status:''};
        const data=window.PortalApp.equipmentWorkspaceCache[window.PortalApp.currentEquipmentWorkspace];
        if(data) window.renderEquipmentWorkspace(data);
    };

    window.buildEquipmentTickets = function(rows) {
        if(!rows.length) return window.cpEmpty('No Service Tickets are linked to this equipment.');

        const f=window.PortalApp.equipmentTicketFilters||{from:'',to:'',type:'',status:''};
        const types=[...new Set(rows.map(x=>x.custom_ticket_type||x.custom_request_type).filter(Boolean))].sort();
        const statuses=[...new Set(rows.map(x=>x.custom_ticket_status).filter(Boolean))].sort();

        const filtered=rows.filter(x=>{
            const d=String(x.custom_opening_date||x.creation||'').slice(0,10);
            if(f.from && d && d<f.from) return false;
            if(f.to && d && d>f.to) return false;
            if(f.type && (x.custom_ticket_type||x.custom_request_type||'')!==f.type) return false;
            if(f.status && (x.custom_ticket_status||'')!==f.status) return false;
            return true;
        });

        const filterBar=`<div class="cp-ticket-filter-row">
            <label><span>From</span><input type="date" value="${window.cpEsc(f.from)}" onchange="window.updateEquipmentTicketFilter('from',this.value)"></label>
            <label><span>To</span><input type="date" value="${window.cpEsc(f.to)}" onchange="window.updateEquipmentTicketFilter('to',this.value)"></label>
            <label><span>Ticket Type</span><select onchange="window.updateEquipmentTicketFilter('type',this.value)"><option value="">All Types</option>${types.map(v=>`<option value="${window.cpEsc(v)}" ${v===f.type?'selected':''}>${window.cpEsc(v)}</option>`).join('')}</select></label>
            <label><span>Status</span><select onchange="window.updateEquipmentTicketFilter('status',this.value)"><option value="">All Statuses</option>${statuses.map(v=>`<option value="${window.cpEsc(v)}" ${v===f.status?'selected':''}>${window.cpEsc(v)}</option>`).join('')}</select></label>
            <button class="cp-filter-clear" onclick="window.clearEquipmentTicketFilters()">Clear</button>
        </div>`;

        const data=window.PortalApp.equipmentWorkspaceCache[window.PortalApp.currentEquipmentWorkspace]||{};
        const eq=data.equipment||{};
        const eqLabel=eq.custom_display_name||eq.custom_asset_name||eq.name||'Equipment';

        const table=filtered.length ? `<div class="cp-log-table"><table><thead><tr><th>Subject</th><th>Date</th><th>Component / Equipment</th><th>Status</th><th>Ticket Type</th><th></th></tr></thead><tbody>${filtered.map(x=>{
            const target=x.custom_target_component_name || eqLabel;
            const typeLabel=x.custom_ticket_type||x.custom_request_type||'—';
            return `<tr>
                <td><strong>${window.cpEsc(x.custom_subject||'Service Request')}</strong><div class="cp-ticket-code">${window.cpEsc(x.name)}</div></td>
                <td>${window.cpFmtDate(x.custom_opening_date||x.creation)}</td>
                <td>${window.cpEsc(target||'—')}</td>
                <td><span class="badge ${['Closed','Resolved','Cancelled'].includes(x.custom_ticket_status)?'badge-success':'badge-warning'}">${window.cpEsc(x.custom_ticket_status||'—')}</span></td>
                <td>${window.cpEsc(typeLabel)}</td>
                <td class="cp-table-action"><a class="cp-small-action cp-small-link" href="/client-portal/ticket?name=${encodeURIComponent(x.name)}">View</a></td>
            </tr>`;
        }).join('')}</tbody></table></div>` : window.cpEmpty('No tickets match these filters.');

        return `${filterBar}${table}`;
    };

    window.openComponentWorkspace = function(componentName) {
        if(!componentName) return;
        window.PortalApp.currentComponentWorkspace=componentName;
        window.PortalApp.componentWorkspaceTab='overview';
        const root=document.getElementById('equipment-detail-view');
        if(root) root.innerHTML='<div class="cp-workspace-loading">Loading component record…</div>';
        const cached=window.PortalApp.componentWorkspaceCache[componentName];
        if(cached) { window.renderComponentWorkspace(cached); return; }
        frappe.call({method:'maintenance_app.api.client_portal_get_component_workspace',args:{component_name:componentName},callback:function(r){if(r.message){window.PortalApp.componentWorkspaceCache[componentName]=r.message;window.renderComponentWorkspace(r.message);}},error:function(){if(root) root.innerHTML=window.cpEmpty('Could not load this component record.');}});
    };

    window.setComponentWorkspaceTab = function(tab) {
        window.PortalApp.componentWorkspaceTab=tab;
        const data=window.PortalApp.componentWorkspaceCache[window.PortalApp.currentComponentWorkspace];
        if(data) window.renderComponentWorkspace(data);
    };

    window.renderComponentWorkspace = function(data) {
        const root=document.getElementById('equipment-detail-view'); if(!root) return;
        const c=data.component||{}, ctx=data.context||{}, eq=ctx.equipment||{};
        const tabs=[['overview','Overview'],['service','Service History'],['lifecycle','Lifecycle'],['config','Configuration'],['tickets','Tickets']];
        let html=`<button class="cp-ws-back" onclick="window.openEquipmentWorkspace('${window.cpEsc(c.custom_parent_equipment||window.PortalApp.currentEquipmentWorkspace)}')">← Back to Equipment</button>
            <section class="cp-ws-hero"><div><div class="cp-eyebrow">Equipment Component</div><div class="cp-ws-title-row"><div class="cp-ws-title">${window.cpEsc(c.custom_display_name||c.custom_equipment_type||c.name)}</div><span class="badge badge-info">${window.cpEsc(c.custom_status||'—')}</span></div>
            <div class="cp-ws-context">${window.cpEsc([ctx.customer_display,ctx.branch_display,c.custom_component_group].filter(Boolean).join(' · '))}</div><div class="cp-ws-meta"><span>${window.cpEsc(c.name)}</span>${c.custom_serial_number?`<span>S/N ${window.cpEsc(c.custom_serial_number)}</span>`:''}</div></div>
            <div class="cp-ws-actions"><button class="btn-primary" onclick="window.cpOpenTicketForEquipment('${window.cpEsc(c.custom_parent_equipment||'')}','${window.cpEsc(c.name||'')}')">+ Raise Ticket</button></div></section>
            <div class="cp-parent-strip"><div><small>Parent Equipment</small><strong>${window.cpEsc(eq.custom_display_name||eq.custom_asset_name||c.custom_parent_equipment||'—')}</strong></div><a href="#" class="cp-row-link" onclick="window.openEquipmentWorkspace('${window.cpEsc(c.custom_parent_equipment||'')}');return false;">View Equipment →</a></div>`;
        html+='<div class="cp-tabs">'+tabs.map(t=>`<button class="cp-tab-btn ${window.PortalApp.componentWorkspaceTab===t[0]?'active':''}" onclick="window.setComponentWorkspaceTab('${t[0]}')">${t[1]}</button>`).join('')+'</div>';
        html+=`<section class="cp-tab-panel">${window.buildComponentWorkspaceTab(data)}</section>`; root.innerHTML=html;
    };

    window.buildComponentWorkspaceTab = function(data) {
        const c=data.component||{}, tab=window.PortalApp.componentWorkspaceTab;
        if(tab==='overview') return `<div class="cp-panel-title">Component Overview</div><div class="cp-info-grid">${window.cpInfoCard('Component ID',window.cpEsc(c.name))}${window.cpInfoCard('Group',window.cpEsc(c.custom_component_group||'—'))}${window.cpInfoCard('Type',window.cpEsc(c.custom_equipment_type||'—'))}${window.cpInfoCard('Make',window.cpEsc(c.custom_make||'—'))}${window.cpInfoCard('Model',window.cpEsc(c.custom_model||'—'))}${window.cpInfoCard('Serial Number',window.cpEsc(c.custom_serial_number||'—'))}${window.cpInfoCard('Part Number',window.cpEsc(c.custom_part_number||'—'))}${window.cpInfoCard('Installation Date',window.cpFmtDate(c.custom_installation_date))}${window.cpInfoCard('Commissioned Date',window.cpFmtDate(c.custom_commissioned_date))}${window.cpInfoCard('Calibration Due',window.cpFmtDate(c.custom_next_calibration_date))}</div>`;
        if(tab==='service') return window.buildEquipmentLogTable(data.service||[],'service');
        if(tab==='lifecycle') return window.buildEquipmentLogTable(data.lifecycle||[],'lifecycle');
        if(tab==='config') return window.buildEquipmentLogTable(data.config||[],'config');
        if(tab==='tickets') return window.buildEquipmentTickets(data.tickets||[]);
        return '';
    };

</script>
